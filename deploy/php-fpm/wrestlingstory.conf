; PHP-FPM pool of WrestlingStory, installed by deploy/setup-vps.sh in /etc/php/8.4/fpm/pool.d/.
; It runs as the "deploy" user, who owns the releases: storage/ and bootstrap/cache are writable
; without changing permissions at each deployment. Nginx (www-data) talks to it through the socket.
[wrestlingstory]
user = deploy
group = deploy

listen = /run/php/wrestlingstory.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Small VPS (1.8 GB RAM, shared with ChatPulse): few workers.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
