# WrestlingStory on the HOSTKEY VPS, next to ChatPulse (which keeps the default server on the bare IP).
# Installed by deploy/setup-vps.sh as /etc/nginx/sites-available/wrestlingstory.
# certbot --nginx then adds the HTTPS server block (443) and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name wrestlingstory.82-25-58-90.sslip.io;

    root /var/www/wrestlingstory/current/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 8m;
    server_tokens off;

    # Security headers (security audit, point 6).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built assets have a hash in their name: they can be cached for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/wrestlingstory.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git...) or other PHP files.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
