# PostgreSQL 17 for local development (Laravel itself runs on the host).
# Credentials come from the project's .env (DB_USERNAME, DB_PASSWORD, DB_DATABASE).
# Start: docker compose up -d    Stop: docker compose down
services:
    postgres:
        image: postgres:17
        restart: unless-stopped
        ports:
            # Only this computer can reach the database (not the local network).
            - '127.0.0.1:${DB_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: '${DB_USERNAME:-postgres}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?Fill DB_PASSWORD in .env first}'
            POSTGRES_DB: '${DB_DATABASE:-wrestlingstory}'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
