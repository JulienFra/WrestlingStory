# CI of WrestlingStory: four jobs run in parallel, each one is a required check to merge into main.
#   Lint  : Pint (PHP style), oxlint and formatting (front)
#   Types : Larastan (PHP), vue-tsc (Vue/TypeScript)
#   Tests : PHPUnit on a real PostgreSQL 17
#   Build : npm run build (Vite)
# Locally, the same checks: `npm run build` then `composer ci:check`.
name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Every job starts with the same installation steps (YAML anchors are not used to keep the file readable).
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v4

            - name: Installer PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pgsql, pdo_pgsql, mbstring, openssl, intl, curl, fileinfo, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Installer Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Installer les dépendances PHP
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Installer les dépendances JavaScript
              run: npm ci

            - name: Style PHP (Pint)
              run: composer lint:check

            - name: Lint et formatage du front (oxlint)
              run: npm run check

    types:
        name: Types
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v4

            - name: Installer PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pgsql, pdo_pgsql, mbstring, openssl, intl, curl, fileinfo, zip, sodium
                  ini-values: memory_limit=512M
                  coverage: none
                  tools: composer:v2

            - name: Installer Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Installer les dépendances PHP
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Installer les dépendances JavaScript
              run: npm ci

            - name: Préparer .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # vue-tsc needs the typed routes that Wayfinder generates (resources/js/routes, actions, wayfinder).
            - name: Générer les routes typées (Wayfinder)
              run: php artisan wayfinder:generate --with-form

            - name: Analyse statique PHP (Larastan)
              run: composer types:check

            - name: Types Vue et TypeScript (vue-tsc)
              run: npm run types:check

    tests:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_DB: wrestlingstory_test
                    # Throwaway database of the job: no password needed.
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_USERNAME: postgres
            DB_PASSWORD: ''

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v4

            - name: Installer PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pgsql, pdo_pgsql, mbstring, openssl, intl, curl, fileinfo, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Installer Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Installer les dépendances PHP
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Installer les dépendances JavaScript
              run: npm ci

            - name: Préparer .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # The pages rendered in the tests need public/build/manifest.json.
            - name: Build du front (pour les tests)
              run: npm run build

            - name: Tests (PHPUnit sur PostgreSQL 17)
              run: php artisan test

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Récupérer le code
              uses: actions/checkout@v4

            # The build calls php (Wayfinder generates the typed routes).
            - name: Installer PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pgsql, pdo_pgsql, mbstring, openssl, intl, curl, fileinfo, zip, sodium
                  coverage: none
                  tools: composer:v2

            - name: Installer Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Installer les dépendances PHP
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Installer les dépendances JavaScript
              run: npm ci

            - name: Préparer .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Build du front (Vite)
              run: npm run build
